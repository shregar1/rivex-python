name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff format --check .
      - run: ruff check .

  # The `rivex` wheel bundles the Rust core (compiled by maturin from the sibling
  # core repo) — there is no separate `rivex-core` package. CI checks out both
  # repos as siblings so the pyproject manifest-path (../core.rivex.vexarr.com)
  # resolves.
  test:
    name: Test (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: python.rivex.vexarr.com
      - uses: actions/checkout@v4
        with:
          repository: rivex-dev/core.rivex.vexarr.com
          path: core.rivex.vexarr.com
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core.rivex.vexarr.com
      - name: Build & install rivex (bundled core) + dev deps
        working-directory: python.rivex.vexarr.com
        run: |
          pip install maturin
          maturin develop --release        # compiles rivex.rivex_core into the venv
          pip install -e ".[dev]"
      - name: Run tests
        working-directory: python.rivex.vexarr.com
        run: pytest tests/ -v --tb=short

  build-wheels:
    name: Wheels (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: linux-x86_64,  os: ubuntu-latest,  target: x86_64,  manylinux: auto }
          - { name: linux-aarch64, os: ubuntu-latest,  target: aarch64, manylinux: auto }
          - { name: macos-x86_64,  os: macos-13,       target: x86_64 }
          - { name: macos-aarch64, os: macos-latest,   target: aarch64 }
          - { name: windows-x64,   os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4
        with:
          path: python.rivex.vexarr.com
      - uses: actions/checkout@v4
        with:
          repository: rivex-dev/core.rivex.vexarr.com
          path: core.rivex.vexarr.com
      - name: Build self-contained wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python.rivex.vexarr.com
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --strip --out dist --interpreter 3.10 3.11 3.12 3.13
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.name }}
          path: python.rivex.vexarr.com/dist/*.whl

  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, build-wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for version bump
        id: version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi
      - name: Download wheels
        if: steps.version.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true
      - name: Create GitHub release
        if: steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: dist/*
      - name: Publish to PyPI
        if: steps.version.outputs.exists == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
          # Trusted publishing (preferred) or set PYPI_API_TOKEN as a repo secret.
          password: ${{ secrets.PYPI_API_TOKEN }}
